<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <p class="subtitle">Student CRUD Management</p>

        <!-- Student Form -->

        <div class="form-card">

            <h2 id="formTitle">Add Student</h2>

            <input type="hidden" id="studentId">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
            >

            <button onclick="saveStudent()" id="saveButton">
                Add Student
            </button>

            <button onclick="clearForm()" class="cancel-button">
                Clear
            </button>

        </div>


        <!-- Student List -->

        <div class="table-card">

            <h2>Student List</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="studentTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
