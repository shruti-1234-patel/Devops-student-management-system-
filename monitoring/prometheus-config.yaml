apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config

data:

  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: 'prometheus'
        static_configs:
          - targets:
              - 'localhost:9090'

      - job_name: 'student-management'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - 'student-management-service:8080'